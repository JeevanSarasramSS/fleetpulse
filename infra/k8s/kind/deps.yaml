# In-cluster stand-ins for the managed services a cloud deployment would use (RDS/Cloud SQL, ElastiCache/Memorystore, MSK/Confluent).
apiVersion: v1
kind: Namespace
metadata: {name: data}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: data}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env: [{name: POSTGRES_USER, value: fleet}, {name: POSTGRES_PASSWORD, value: fleet}, {name: POSTGRES_DB, value: fleet}]
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, fleet]}, periodSeconds: 3}
          volumeMounts: [{name: init, mountPath: /docker-entrypoint-initdb.d}]
      volumes: [{name: init, configMap: {name: db-init}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: data}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: data}
spec:
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers: [{name: redis, image: "redis:7-alpine", ports: [{containerPort: 6379}]}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: data}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redpanda, namespace: data}
spec:
  selector: {matchLabels: {app: redpanda}}
  template:
    metadata: {labels: {app: redpanda}}
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.4
          args: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 1G, --overprovisioned,
                 --kafka-addr, "PLAINTEXT://0.0.0.0:9092", --advertise-kafka-addr, "PLAINTEXT://redpanda.data:9092"]
          ports: [{containerPort: 9092}]
          readinessProbe: {exec: {command: [rpk, cluster, health, --exit-when-healthy]}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: redpanda, namespace: data}
spec: {selector: {app: redpanda}, ports: [{port: 9092}]}
