name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pytest pytest-cov pytest-bdd ruff httpx
      - run: ruff check fleetpulse tests --select E,F,W --ignore E501
      - run: pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep bandit pip-audit
      - run: semgrep scan --config p/python --config p/owasp-top-ten --error --exclude tests || true
      - run: bandit -r fleetpulse -ll
      - run: pip-audit -r requirements.txt || true
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: NUM_VEHICLES=100000 docker compose up -d --build
      - run: |
          for i in $(seq 1 60); do curl -sf localhost:8000/readyz && break; sleep 3; done
          sleep 30
          pip install pytest pytest-bdd httpx pytest-github-actions-annotate-failures
          pytest -m integration tests/integration tests/contract tests/acceptance -o addopts="" --junitxml=e2e.xml
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "fleetpulse:latest", severity: "CRITICAL,HIGH", exit-code: "0", format: table}
      - name: DAST - OWASP ZAP baseline against the running API
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8000"
          allow_issue_writing: false
          fail_action: false
      - name: Chaos - kill a processor and the broker, prove recovery
        run: |
          docker compose kill processor && sleep 5 && docker compose up -d processor
          docker compose restart redpanda && sleep 20
          pytest -m integration tests/integration -o addopts="" -k recovers
      - if: always()
        run: docker compose logs --tail 200
  k8s:
    # Portability proof: the production K8s manifests, unchanged except for configuration (infra/k8s/kind),
    # deployed on a real Kubernetes cluster (kind) under the "restricted" Pod Security profile.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {cluster_name: fleetpulse}
      - run: docker build -t fleetpulse:latest . && kind load docker-image fleetpulse:latest --name fleetpulse
      - name: Deploy (manifests + in-cluster stand-ins for managed Postgres/Redis/Kafka)
        run: |
          diag() {  # annotations are readable without signing in to GitHub
            echo "::error title=k8s deploy failed::$(kubectl get pods -A --no-headers | paste -sd ';')"
            echo "::error title=seed logs::$(kubectl -n fleetpulse logs job/seed --tail 15 2>&1 | paste -sd ';')"
            echo "::error title=events::$(kubectl get events -A --sort-by=.lastTimestamp | tail -15 | paste -sd ';')"
            exit 1
          }
          kubectl kustomize --load-restrictor LoadRestrictionsNone infra/k8s/kind | kubectl apply -f -
          kubectl -n data wait --for=condition=available deploy --all --timeout=600s || diag
          kubectl -n fleetpulse wait --for=condition=complete job/seed --timeout=600s || diag
          kubectl -n fleetpulse rollout restart deploy/processor   # reload the seeded fleet
          kubectl -n fleetpulse rollout status deploy/processor --timeout=300s || diag
          kubectl -n fleetpulse rollout status deploy/api --timeout=300s || diag
          kubectl apply -f infra/k8s/kind/stream-job.yaml
      - name: Smoke test through the Service
        run: |
          kubectl -n fleetpulse port-forward svc/api 8080:80 >/dev/null 2>&1 &
          sleep 5
          curl -sf localhost:8080/readyz
          TOKEN=$(curl -sf -X POST localhost:8080/api/v1/auth/token -H 'Content-Type: application/json' \
            -d '{"email":"manager@aurora.demo","password":"demo1234"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          for i in $(seq 1 40); do
            S=$(curl -sf localhost:8080/api/v1/stats -H "Authorization: Bearer $TOKEN"); echo "$S"
            python3 -c 'import sys,json;s=json.loads(sys.argv[1]);sys.exit(0 if s["vehicles"]>0 and s["events_total"]>0 else 1)' "$S" && exit 0
            sleep 5
          done
          exit 1
      - if: always()
        run: |
          kubectl get pods -A -o wide
          kubectl -n fleetpulse logs deploy/processor --tail 30 || true
          kubectl -n fleetpulse logs job/simulator --tail 10 || true
